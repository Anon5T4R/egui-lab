[workspace]
resolver = "2"
members = ["crates/lab-ui", "apps/lab-monitor", "apps/lab-calc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
