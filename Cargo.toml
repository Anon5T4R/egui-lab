[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# Integração OS (lab-clip) — mesmos crates que o Tauri usa por baixo
arboard = "3.6"
tray-icon = "0.24"
global-hotkey = "0.8"
# Cripto do lab-keys — MESMOS pins do LocalKeys (crypto.rs copiado verbatim)
rand = "0.8"
zeroize = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
totp-rs = { version = "5", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
# PNG das imagens do lab-clip (o eframe já puxa image 0.25 — sem custo no lock)
image = "0.25"
# Hub: downloads das releases (ureq = sync+rustls, sem tokio/openssl) e unzip
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip", "json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.21"
# Embed do vídeo no lab-player (Linux): child X11 — Rust puro, sem libxcb
x11rb = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
# Diálogo de arquivo nativo (só Windows; no Linux o caminho é digitado,
# de propósito — gtk3 no AppImage engordaria dezenas de MB)
rfd = { version = "0.17", default-features = false }

[profile.release]
lto = "thin"
strip = true

