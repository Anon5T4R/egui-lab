[package]
name = "lab-keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
lab-ui = { path = "../../crates/lab-ui" }
serde.workspace = true
serde_json.workspace = true
# Cripto — MESMOS pins do LocalKeys (crypto.rs/totp.rs copiados verbatim)
argon2.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true
totp-rs.workspace = true
arboard.workspace = true

[target.'cfg(windows)'.dependencies]
# Desbloqueio rápido (chave no Credential Manager) — só no Windows: o
# secret-service do Linux puxaria libdbus pro build/AppImage (runner nem tem
# dbus-1 dev). Mesma política do tray/rfd: AppImage enxuto.
keyring.workspace = true
base64.workspace = true
# Flag ExcludeClipboardContentFromMonitorProcessing ao copiar senha
clipboard-win = "5.4"
rfd.workspace = true
