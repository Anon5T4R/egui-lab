[package]
name = "lab-keys"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
lab-ui = { path = "../../crates/lab-ui" }
serde.workspace = true
serde_json.workspace = true
# Cripto — MESMOS pins do LocalKeys (crypto.rs/totp.rs copiados verbatim)
argon2.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true
totp-rs.workspace = true
arboard.workspace = true
# Base64 em TODAS as plataformas: anexos (vault.rs) e o import do export
# cifrado do Bitwarden (bwdecrypt.rs) usam — o desbloqueio rápido no keyring
# também, e continua funcionando.
base64.workspace = true
# Import de cofres KeePass (.kdbx) — lê/decifra com a senha do usuário.
keepass.workspace = true
# Gerador de senha/passphrase + medidor de força (zxcvbn).
zxcvbn.workspace = true
# Import do export CIFRADO do Bitwarden (PBKDF2/Argon2id → HKDF → AES-CBC+HMAC).
pbkdf2.workspace = true
hkdf.workspace = true
sha2.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true

[target.'cfg(windows)'.dependencies]
# Desbloqueio rápido (chave no Credential Manager) — só no Windows: o
# secret-service do Linux puxaria libdbus pro build/AppImage (runner nem tem
# dbus-1 dev). Mesma política do tray/rfd: AppImage enxuto.
keyring.workspace = true
# Auto-type (digita usuário/senha no campo focado de outro app) — só Windows:
# no Linux o enigo puxaria X11 dev, mesma política do keyring/rfd.
enigo = "0.3"
# Flag ExcludeClipboardContentFromMonitorProcessing ao copiar senha
clipboard-win = "5.4"
rfd.workspace = true
# Bandeja só no Windows (mesma política do lab-clip: no Linux o tray-icon
# puxaria muda→gtk3 e engordaria o AppImage).
tray-icon.workspace = true
# Controle da janela fora do ciclo de pintura — janela oculta não recebe
# WM_PAINT no Windows, o eframe congela; a thread da bandeja acorda a
# janela com ShowWindow direto (ver winctl.rs).
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
