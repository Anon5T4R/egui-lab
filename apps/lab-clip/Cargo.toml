[package]
name = "lab-clip"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe.workspace = true
egui.workspace = true
lab-ui = { path = "../../crates/lab-ui" }
serde.workspace = true
serde_json.workspace = true
arboard.workspace = true
image.workspace = true
global-hotkey.workspace = true

[target.'cfg(windows)'.dependencies]
# Bandeja só no Windows: no Linux o tray-icon puxa muda→gtk3 (glib-sys), que
# engordaria o AppImage em dezenas de MB — mesma razão do rfd ser win-only.
# O atalho global (X11) continua nos dois.
tray-icon.workspace = true
# Leitura da flag ExcludeClipboardContentFromMonitorProcessing (privacidade)
clipboard-win = "5.4"
# Autostart no registro (Run) — mesmo desenho do LocalClip oficial
winreg = "0.55"
# Controle da janela fora do ciclo de pintura (app de bandeja: janela oculta
# não recebe WM_PAINT no Windows → o eframe congela; o controller acorda a
# janela com ShowWindow direto).
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }
